name: Confenge GHCR image

on:
  push:
    branches:
      - confenge-production-v2.4.0
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/quickly-confenge
  RELEASE_TAG: v2.4.0-confenge.1

jobs:
  build-and-push:
    name: Build and push linux/amd64
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.reference }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the exact fork revision
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.title=Quickly Confenge
            org.opencontainers.image.description=Confenge production build of Quickly v2.4.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish immutable deployment reference
        id: image
        shell: bash
        run: |
          printf 'reference=%s@%s\n' "$IMAGE_NAME" "${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          printf 'Immutable image: %s@%s\n' "$IMAGE_NAME" "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
