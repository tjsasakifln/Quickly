# Install this as one additional server block in the existing host nginx.
# The certificate directives follow the host's existing ACME convention.
server {
    listen 80;
    listen [::]:80;
    server_name campanhas.confenge.com.br;

    # Keep the HTTP-01 path reachable for unattended certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name campanhas.confenge.com.br;

    # Set these to the certificate paths already managed by the existing proxy.
    ssl_certificate /etc/letsencrypt/live/campanhas.confenge.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campanhas.confenge.com.br/privkey.pem;

    client_max_body_size 25m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:19080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not trust client-supplied forwarding headers. This configuration
        # assumes DNS-only traffic. If a trusted reverse proxy is enabled,
        # configure nginx real_ip with its published trusted ranges first.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Scheme "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Url-Scheme "";
    }
}
