# Phase 1 only: install this HTTP-only block, validate/reload nginx, then use
# the existing host ACME tooling to issue the certificate with this webroot.
# Replace it with campanhas.confenge.com.br.conf only after issuance succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name campanhas.confenge.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
